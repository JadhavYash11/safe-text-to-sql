[project]
name = "safe-text-to-sql"
version = "0.1.0"
description = "A schema-aware Text-to-SQL API with guardrails and validation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=1.1.0",
    "duckdb-engine>=0.13.0",
    "psycopg[binary]>=3.1.0",
    "sqlparse>=0.5.0",
    "pydantic>=2.8.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.37.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0", "ruff>=0.6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
